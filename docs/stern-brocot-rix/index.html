<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RiX Stern–Brocot explorer</title><link rel="stylesheet" href="assets/rix-page.css?v=041826afe403"></head>
<body><main id="rix-app"><noscript>This RiX page needs JavaScript enabled.</noscript></main><script>globalThis.__RIX_PAGE__={"source":"/**\nplugins: [stern-brocot]\n**/\n\n## A generated-page showcase for exact Stern–Brocot exploration.\n## The same pure RiX model also drives rix-web's prewritten page.\n\n$$current := .frac(0, 1);\n$$formulaSource := \"x^2\";\n$$decimalPreview := _;\n$$decimalDigits := 12;\n\nSternBrocotBoxWidth(text) -> {>> 116, 32 + 11 * text.Len() };\n\nSternBrocotRationalDecimalText(value, limit) -> {;\n    text := value.ToRepeatingDecimal({=\n        limit=limit,\n        onLimit=\"trunc\"\n    });\n    text.EndsWith(\"#0\") ?: text.Slice(1, text.Len() - 1) ?_ text\n};\n\nSternBrocotDecimalText(value, limit) ->\n    value ? :Rational\n        ?: SternBrocotRationalDecimalText(value, limit)\n        ?_ @\"@{value}\";\n\nSternBrocotFractionText(fraction, showDecimals, limit) ->\n    showDecimals == _\n        ?: fraction.ToString()\n        ?_ SternBrocotDecimalText(fraction.Rational(), limit);\n\nSternBrocotDecimalLimit(value) ->\n    (value > 0 && value == (value // 1) && value \u003c= 80)\n        ?: _\n        ?_ \"maximum decimal digits must be an integer from 1 to 80\";\n\nSternBrocotGlyph(text, x, y, fill, label) -> {;\n    width := SternBrocotBoxWidth(text);\n    .Graphics.Group([\n        .Graphics.Text([x, y - 32], label, {=\n            anchor=\"middle\",\n            size=12,\n            weight=\"bold\",\n            fill=\"#7768a7\"\n        }),\n        .Graphics.Rectangle([x - width / 2, y - 23], [width, 46], {=\n            fill=fill,\n            stroke=\"#4a4560\",\n            width=2,\n            radius=11\n        }),\n        .Graphics.Text([x, y + 6], text, {=\n            anchor=\"middle\",\n            size=18,\n            weight=\"bold\",\n            fill=\"#172033\"\n        })\n    ])\n};\n\nSternBrocotFormulaGlyph(text, x, y) -> {;\n    width := {>> 260, 42 + 10 * text.Len() };\n    .Graphics.Group([\n        .Graphics.Text([x, y - 34], \"FORMULA RESULT\", {=\n            anchor=\"middle\",\n            size=12,\n            weight=\"bold\",\n            fill=\"#7768a7\"\n        }),\n        .Graphics.Rectangle([x - width / 2, y - 24], [width, 48], {=\n            fill=\"#f4efff\",\n            stroke=\"#6551c6\",\n            width=2,\n            radius=11\n        }),\n        .Graphics.Text([x, y + 6], text, {=\n            anchor=\"middle\",\n            size=16,\n            weight=\"bold\",\n            fill=\"#2f236b\"\n        })\n    ])\n};\n\n$$view := {;\n    node := .sternBrocotDescribe($current);\n    tree := .sternBrocotVisibleTree(node[\"current\"], 2);\n    formulaValue := .Eval($formulaSource, {= x=node[\"rational\"] }, :fresh);\n    tableRows := tree[\"nodes\"].Map(record -> [\n        record[\"role\"],\n        record[\"level\"],\n        record[\"fraction\"],\n        record[\"parent\"]\n    ]);\n    currentFraction := node[\"current\"];\n    parent := node[\"parent\"];\n    children := node[\"children\"];\n    showDecimals := $decimalPreview;\n    decimalLimit := $decimalDigits;\n    currentText := SternBrocotFractionText(currentFraction, showDecimals, decimalLimit);\n    parentText := parent == _ ?: _ ?_ SternBrocotFractionText(parent, showDecimals, decimalLimit);\n    leftText := SternBrocotFractionText(children[1], showDecimals, decimalLimit);\n    rightText := SternBrocotFractionText(children[2], showDecimals, decimalLimit);\n    formulaResultText := showDecimals == _\n        ?: @\"@{formulaValue}\"\n        ?_ SternBrocotDecimalText(formulaValue, decimalLimit);\n    formulaDisplay := @\"@{$formulaSource} = @{formulaResultText}\";\n    currentWidth := SternBrocotBoxWidth(currentText);\n    parentWidth := parent == _ ?: 0 ?_ SternBrocotBoxWidth(parentText);\n    leftWidth := SternBrocotBoxWidth(leftText);\n    rightWidth := SternBrocotBoxWidth(rightText);\n    formulaWidth := {>> 260, 42 + 10 * formulaDisplay.Len() };\n    graphicWidth := {>>\n        600,\n        currentWidth + 80,\n        parentWidth + 80,\n        leftWidth + rightWidth + 88,\n        formulaWidth + 80\n    };\n    centerX := graphicWidth / 2;\n    leftX := 32 + leftWidth / 2;\n    rightX := graphicWidth - 32 - rightWidth / 2;\n    currentY := parent == _ ?: 82 ?_ 148;\n    childY := parent == _ ?: 232 ?_ 270;\n    parentParts := parent == _\n        ?: []\n        ?_ [\n            .Graphics.Path([[centerX, 70], [centerX, 120]], {= stroke=\"#aaa3c9\", width=3 }),\n            .Graphics.Action({=\n                id=\"scene-parent\",\n                target=$$current,\n                action=value -> value.F().SternBrocotParent(),\n                label=\"Go to parent\",\n                children=[SternBrocotGlyph(parentText, centerX, 45, \"#eeeafc\", \"PARENT\")]\n            })\n        ];\n    treeGraphic := .Graphics.Graphic([graphicWidth, 400], [\n        .Graphics.Path([[centerX, currentY + 24], [leftX, childY - 24]], {= stroke=\"#aaa3c9\", width=3 }),\n        .Graphics.Path([[centerX, currentY + 24], [rightX, childY - 24]], {= stroke=\"#aaa3c9\", width=3 })\n    ] ++ parentParts ++ [\n        SternBrocotGlyph(currentText, centerX, currentY, \"#fff2be\", \"CURRENT\"),\n        .Graphics.Action({=\n            id=\"scene-left\",\n            target=$$current,\n            action=value -> value.F().SternBrocotChildren()[1],\n            label=\"Go to left child\",\n            children=[SternBrocotGlyph(leftText, leftX, childY, \"#e2f8ec\", \"LEFT CHILD\")]\n        }),\n        .Graphics.Action({=\n            id=\"scene-right\",\n            target=$$current,\n            action=value -> value.F().SternBrocotChildren()[2],\n            label=\"Go to right child\",\n            children=[SternBrocotGlyph(rightText, rightX, childY, \"#e5edff\", \"RIGHT CHILD\")]\n        }),\n        SternBrocotFormulaGlyph(formulaDisplay, centerX, 362)\n    ]);\n\n    hero := .Section({=\n        level=1,\n        title=\"Explore exact rationals\",\n        style={= variant=\"hero\", width=\"full\" },\n        children=[\n            .Paragraph(\"Navigate the Stern–Brocot tree, inspect each node's exact structure, and evaluate a RiX formula at the selected rational.\"),\n            .Paragraph([.Link({= href=\"../showcases.html\", children=\"← All RiX showcases\" })])\n        ]\n    });\n\n    navigation := .ControlPanel({=\n        title=\"Move through the tree\",\n        description=\"Every step is computed from the exact structural fraction.\",\n        style={=\n            layout=\"grid\",\n            columns=3,\n            gap=\"compact\",\n            kinds={= action={= variant=\"primary\" } },\n            ids={=\n                parent={= row=1, column=2 },\n                left={= row=2, column=1 },\n                right={= row=2, column=3 },\n                root={= row=3, column=2, variant=\"quiet\" }\n            }\n        },\n        controls=[\n            .Controls.Action({=\n                id=\"parent\",\n                target=$$current,\n                action=value -> {;\n                    parent := value.F().SternBrocotParent();\n                    parent == _ ?: value ?_ parent\n                },\n                label=\"↑ Parent\",\n                shortcut=\"ArrowUp\",\n                disabled=node[\"parent\"] == _\n            }),\n            .Controls.Action({=\n                id=\"left\",\n                target=$$current,\n                action=value -> value.F().SternBrocotChildren()[1],\n                label=\"← Left child\",\n                shortcut=\"ArrowLeft\"\n            }),\n            .Controls.Action({=\n                id=\"right\",\n                target=$$current,\n                action=value -> value.F().SternBrocotChildren()[2],\n                label=\"Right child →\",\n                shortcut=\"ArrowRight\"\n            }),\n            .Controls.Action({=\n                id=\"root\",\n                target=$$current,\n                action=value -> .frac(0, 1),\n                label=\"Root\"\n            })\n        ]\n    });\n\n    comparison := .ControlPanel({=\n        title=\"Jump and compare\",\n        description=\"Jump accepts a RiX fraction expression. Formula is plain RiX source evaluated with exact x in a fresh scope.\",\n        style={= gap=\"normal\", all={= width=\"full\" } },\n        controls=[\n            .Controls.Input({=\n                id=\"jump\",\n                target=$$current,\n                label=\"Jump to fraction\",\n                placeholder=\"3/5 or .frac(3, 5)\"\n            }),\n            .Controls.Input({=\n                id=\"formula\",\n                target=$$formulaSource,\n                label=\"Formula in x\",\n                placeholder=\"x^2 - 1/2\",\n                inputMode=:text\n            }),\n            .Controls.Input({=\n                id=\"decimal-digits\",\n                target=$$decimalDigits,\n                label=\"Maximum decimal digits\",\n                help=\"Terminating decimals and short repeating cycles stay shorter.\",\n                placeholder=\"12\",\n                validate=SternBrocotDecimalLimit\n            }),\n            .Controls.Hold({=\n                id=\"decimal-preview\",\n                target=$$decimalPreview,\n                key=\"ArrowDown\",\n                pressed=1,\n                released=_,\n                label=\"Hold ↓ for decimal labels\",\n                help=\"Display only: the exact fraction and formula values do not change.\"\n            })\n        ]\n    });\n\n    exactData := .Section({=\n        level=2,\n        title=\"Exact node data\",\n        style={= variant=\"card\", width=\"full\" },\n        children=[.Table({=\n            columns=[\"Quantity\", \"Exact value\"],\n            options={= density=\"compact\", variant=\"plain\" },\n            rows=[\n                [\"Current\", node[\"current\"]],\n                [\"Depth\", node[\"depth\"]],\n                [\"Path\", node[\"path\"]],\n                [\"Farey boundaries\", node[\"boundaries\"]],\n                [\"Continued fraction\", node[\"continuedfraction\"]],\n                [\"Convergents\", node[\"convergents\"]],\n                [\"Formula\", $formulaSource],\n                [\"Formula result\", formulaValue]\n            ]\n        })]\n    });\n\n    workbench := .Fragment({=\n        style={= layout=\"split\", gap=\"spacious\", align=\"start\", width=\"full\" },\n        children=[\n            .Fragment({=\n                style={= layout=\"stack\", gap=\"normal\" },\n                children=[navigation, comparison]\n            }),\n            .Fragment({=\n                style={= layout=\"stack\", gap=\"normal\" },\n                children=[\n                    .Figure({=\n                        content=treeGraphic,\n                        caption=\"Parent, current node, exact children, and the live formula result.\",\n                        style={= variant=\"card\", width=\"full\" }\n                    }),\n                    exactData\n                ]\n            })\n        ]\n    });\n\n    records := .Section({=\n        level=2,\n        title=\"Portable visible-tree records\",\n        style={= variant=\"muted\", width=\"full\" },\n        children=[\n            .Paragraph(\"These renderer-neutral records are the exact model that a richer browser tree layout can consume.\"),\n            .Table({=\n                columns=[\"Role\", \"Relative level\", \"Fraction\", \"Parent\"],\n                options={= density=\"compact\", variant=\"muted\" },\n                rows=tableRows\n            })\n        ]\n    });\n\n    .Fragment({=\n        style={= layout=\"stack\", gap=\"spacious\", width=\"full\" },\n        children=[hero, workbench, records]\n    })\n};\n\n.Out(\"index.html\", $view)\n","sourcePath":"rix/examples/stern-brocot/stern-brocot-page.rix","title":"RiX Stern–Brocot explorer","plugins":["stern-brocot"]};</script><script src="assets/rix-page.js?v=b5ee1382799c"></script></body></html>
