<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RiX Stern–Brocot explorer</title><link rel="stylesheet" href="assets/rix-page.css"></head>
<body><main id="rix-app"><noscript>This RiX page needs JavaScript enabled.</noscript></main><script>globalThis.__RIX_PAGE__={"source":"/**\nplugins: [stern-brocot]\n**/\n\n## A first generated-page slice for the exact Stern-Brocot explorer.\n## The same pure RiX model also drives rix-web's prewritten page.\n\nSternBrocotGlyph(fraction, x, y, fill) -> .Graphics.Group([\n    .Graphics.Rectangle([x - 45, y - 22], [90, 44], {=\n        fill=fill,\n        stroke=\"#334155\",\n        width=2,\n        radius=8\n    }),\n    .Graphics.Text([x, y + 5], fraction.ToString(), {=\n        anchor=\"middle\",\n        size=16,\n        weight=\"bold\",\n        fill=\"#0f172a\"\n    })\n]);\n\nSternBrocotGraphic(node) -> {;\n    current := node[\"current\"];\n    parent := node[\"parent\"];\n    children := node[\"children\"];\n    parentParts := parent == _\n        ?: []\n        ?_ [\n            .Graphics.Path([[300, 82], [300, 138]], {= stroke=\"#64748b\", width=2 }),\n            SternBrocotGlyph(parent, 300, 60, \"#e2e8f0\")\n        ];\n    .Graphics.Graphic([600, 320], [\n        .Graphics.Path([[300, 182], [180, 258]], {= stroke=\"#64748b\", width=2 }),\n        .Graphics.Path([[300, 182], [420, 258]], {= stroke=\"#64748b\", width=2 })\n    ] ++ parentParts ++ [\n        SternBrocotGlyph(current, 300, 160, \"#fef3c7\"),\n        SternBrocotGlyph(children[1], 180, 280, \"#dcfce7\"),\n        SternBrocotGlyph(children[2], 420, 280, \"#dbeafe\")\n    ])\n};\n\n$$current := .frac(0, 1);\n$$Formula := x -> x^2;\n\n$$view := {;\n    node := .sternBrocotDescribe($current);\n    tree := .sternBrocotVisibleTree(node[\"current\"], 2);\n    formulaValue := .sternBrocotEvaluate($Formula, node[\"current\"]);\n    tableRows := tree[\"nodes\"].Map(record -> [\n        record[\"role\"],\n        record[\"level\"],\n        record[\"fraction\"],\n        record[\"parent\"]\n    ]);\n\n    .Fragment([\n        .Heading(1, \"RiX Stern–Brocot explorer\"),\n        .Paragraph(\"This standalone page is generated by RiX. Navigation, node records, continued fractions, convergents, and formula evaluation remain exact.\"),\n        .ControlPanel({=\n            title=\"Navigate and compare\",\n            description=\"The formula input accepts a callable such as x -> x^2 - 1/2. The jump input accepts a RiX value such as 3/5 or .frac(3, 5).\",\n            style={=\n                kinds={= action={= variant=\"primary\" } },\n                ids={= reset={= variant=\"quiet\" } }\n            },\n            controls=[\n                .Controls.Action({=\n                    id=\"parent\",\n                    target=$$current,\n                    action=value -> {;\n                        parent := value.F().SternBrocotParent();\n                        parent == _ ?: value ?_ parent\n                    },\n                    label=\"Up\"\n                }),\n                .Controls.Action({=\n                    id=\"left\",\n                    target=$$current,\n                    action=value -> value.F().SternBrocotChildren()[1],\n                    label=\"Left child\"\n                }),\n                .Controls.Action({=\n                    id=\"right\",\n                    target=$$current,\n                    action=value -> value.F().SternBrocotChildren()[2],\n                    label=\"Right child\"\n                }),\n                .Controls.Action({=\n                    id=\"reset\",\n                    target=$$current,\n                    action=value -> .frac(0, 1),\n                    label=\"Root\"\n                }),\n                .Controls.Input({=\n                    id=\"jump\",\n                    target=$$current,\n                    label=\"Jump to fraction\",\n                    placeholder=\"3/5\"\n                }),\n                .Controls.Input({=\n                    id=\"formula\",\n                    target=$$Formula,\n                    label=\"Formula\",\n                    placeholder=\"x -> x^2\"\n                })\n            ]\n        }),\n        .Figure(SternBrocotGraphic(node), \"Parent, current node, and exact left/right children.\"),\n        .Table({=\n            columns=[\"Quantity\", \"Exact value\"],\n            rows=[\n                [\"Current\", node[\"current\"]],\n                [\"Depth\", node[\"depth\"]],\n                [\"Path\", node[\"path\"]],\n                [\"Farey boundaries\", node[\"boundaries\"]],\n                [\"Continued fraction\", node[\"continuedfraction\"]],\n                [\"Convergents\", node[\"convergents\"]],\n                [\"Formula result\", formulaValue]\n            ]\n        }),\n        .Heading(2, \"Portable visible-tree records\"),\n        .Table({=\n            columns=[\"Role\", \"Relative level\", \"Fraction\", \"Parent\"],\n            rows=tableRows\n        })\n    ])\n};\n\n.Out(\"index.html\", $view)\n","sourcePath":"rix/examples/stern-brocot/stern-brocot-page.rix","title":"RiX Stern–Brocot explorer","plugins":["stern-brocot"]};</script><script src="assets/rix-page.js"></script></body></html>
